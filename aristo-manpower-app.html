<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aristo Contract Manpower</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap">
<style>
/* Layout: HR web app (sidebar + workspace) with the contractor and supervisor mobile apps shown in a phone frame. Single dark brand look. */
:root{
  color-scheme:dark;
  --surface-000:#080807;--surface-100:#1a1917;--surface-200:#131512;--surface-raised:#24221f;--surface-hover:#2c2925;
  --ink:#ffffff;--ink-cream:#f5f0e8;--ink-muted:#a39d94;
  --gold:#c4a882;--gold-hover:#d4bc9a;--gold-line:rgba(196,168,130,.6);--gold-tint:rgba(196,168,130,.1);--on-gold:#000;
  --hairline:rgba(255,255,255,.1);--hairline-strong:rgba(255,255,255,.16);
  --green:#3fbf7f;--danger:#ef5f64;--warn:#e8b04a;--brand-green:#009846;
  --font-display:"Playfair Display",Georgia,"Times New Roman",serif;
  --font-sans:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--surface-100);color:var(--ink-cream);font-family:var(--font-sans);font-size:14px;line-height:1.6}
h1,h2,h3{font-family:var(--font-display);color:var(--ink);margin:0;letter-spacing:-.3px;font-weight:700;text-wrap:balance}
h1{font-size:32px;line-height:38px}
h2{font-size:20px;line-height:26px}
a{color:var(--gold);text-decoration:none}a:hover{color:var(--gold-hover)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;font-family:var(--font-sans);font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;border:1px solid transparent;border-radius:0;padding:0 22px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,color .15s}
.btn-primary{background:var(--gold);color:var(--on-gold)}.btn-primary:hover{background:var(--gold-hover);color:var(--on-gold)}
.btn-secondary{background:transparent;color:var(--gold);border-color:var(--gold-line)}.btn-secondary:hover{background:var(--gold-tint);color:var(--gold-hover)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-sm{min-height:36px;padding:0 14px;font-size:11px;letter-spacing:1.5px}
.btn-xs{min-height:32px;padding:0 12px;font-size:10px;letter-spacing:1.2px}
.seg{display:flex;gap:8px;flex-wrap:wrap}

.card{background:var(--surface-raised);border:1px solid var(--hairline);border-radius:12px}
.pad{padding:20px}
.label{font-size:11px;font-weight:500;letter-spacing:1px;text-transform:uppercase;color:var(--ink-muted)}
.eyebrow{font-family:var(--font-display);font-style:italic;font-weight:500;color:var(--gold);font-size:15px}
.muted{color:var(--ink-muted)}
.small{font-size:12px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;padding:2px 10px;border-radius:999px;border:1px solid var(--hairline-strong);color:var(--ink-muted);white-space:nowrap;line-height:18px}
.pill-gold{color:var(--gold);border-color:var(--gold-line);background:var(--gold-tint)}
.pill-ok{color:var(--green);border-color:var(--green)}
.pill-warn{color:var(--warn);border-color:var(--warn)}
.pill-bad{color:var(--danger);border-color:var(--danger)}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field input,.field select,.field textarea{font:inherit;color:var(--ink);background:var(--surface-100);border:1px solid var(--hairline-strong);border-radius:8px;padding:10px 12px;min-height:44px;outline:none;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold)}
.field .err{font-size:12px;color:var(--danger)}
.grid-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}

.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;font-weight:500;letter-spacing:1px;text-transform:uppercase;color:var(--ink-muted);padding:10px 12px;border-bottom:1px solid var(--hairline);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--hairline);color:var(--ink-cream);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
.bar{height:6px;border-radius:999px;background:var(--hairline);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--gold);transition:width .3s}

/* Shell */
.shell{display:flex;min-height:100%}
.side{flex:0 0 240px;background:var(--surface-000);border-right:1px solid var(--hairline);padding:24px 16px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto}
.side .logo{height:22px;width:auto;align-self:flex-start;margin:0 12px 28px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 12px;color:var(--ink-muted);font-size:13px;font-weight:500;border-radius:8px;white-space:nowrap}
.nav svg{flex:none;opacity:.85}
.nav:hover{color:var(--ink);background:var(--gold-tint)}
.nav.on{color:var(--gold);background:var(--gold-tint)}
.nav .count{margin-left:auto;font-size:11px;color:var(--danger);font-variant-numeric:tabular-nums}
.side .group{padding:20px 12px 6px}
.side .foot{margin-top:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.linkbtn{background:none;border:0;padding:0;color:var(--gold);cursor:pointer;font-size:12px;text-align:left}
.linkbtn:hover{color:var(--gold-hover)}
td .linkbtn{white-space:nowrap}
.main{flex:1 1 auto;min-width:0;padding-block:32px 48px;padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:max(40px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:24px;max-width:1360px}
.head{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.head .titles{display:flex;flex-direction:column;gap:4px;min-width:0}
.head .tools{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.row>*{min-width:0}

@media (max-width:860px){
  .shell{flex-direction:column}
  .side{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;height:auto;flex:none;flex-direction:row;align-items:center;gap:4px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-right:0;border-bottom:1px solid var(--hairline);overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
  .side .logo{margin:0 12px 0 0;height:18px}
  .side .group,.side .foot{display:none}
  .nav{padding:8px 10px}
  .nav svg{display:none}
  .main{padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  h1{font-size:26px;line-height:32px}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface-000)}
}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpis.three{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpis.three{grid-template-columns:1fr}}
@media (max-width:520px){.kpis{grid-template-columns:1fr}}
.kpi{padding:20px;display:flex;flex-direction:column;gap:6px}
.kpi .v{font-family:var(--font-display);font-size:36px;line-height:42px;color:var(--ink);font-variant-numeric:tabular-nums}

/* Kanban */
.kanban{display:grid;grid-template-columns:repeat(6,minmax(190px,1fr));gap:12px;min-width:1180px;padding-bottom:4px}
.kcol{background:var(--surface-200);border:1px solid var(--hairline);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:420px}
.kcol-h{display:flex;justify-content:space-between;align-items:center}
.kcard{padding:12px;display:flex;flex-direction:column;gap:6px}
.kcard .nm{color:var(--ink);font-weight:500;font-size:14px;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.kcard .nm:hover{color:var(--gold-hover)}
.kcard .adv{margin-top:4px;align-self:stretch}
.kcard.fresh{border-color:var(--gold-line);animation:glow 1.6s ease-out}
@keyframes glow{from{box-shadow:0 0 0 3px var(--gold-tint)}to{box-shadow:none}}

/* Timeline */
.tl{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.tl>div{display:flex;flex-direction:column;gap:4px}
.tl .ln{height:4px}

/* Chart */
.chart{position:relative;height:240px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px;align-items:end;border-bottom:1px solid var(--hairline-strong)}
.chart .col{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.chart .val{font-size:12px;color:var(--ink);margin-bottom:6px;font-variant-numeric:tabular-nums}
.chart .b{width:100%;max-width:48px;border-radius:3px 3px 0 0}
.chart .target{position:absolute;left:0;right:0;border-top:1px dashed var(--gold-line);pointer-events:none}
.chart .target span{position:absolute;right:0;top:-20px;font-size:11px;color:var(--gold);background:var(--surface-raised);padding:0 4px}
.xlab{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px;font-size:11px;color:var(--ink-muted);text-align:center}

/* Phone */
.phone-wrap{display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start}
.phone{width:390px;max-width:100%;height:800px;max-height:calc(100vh - 140px);min-height:600px;background:var(--surface-100);border:1px solid var(--hairline-strong);border-radius:36px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 64px rgba(0,0,0,.5);flex:none}
.phone-aside{flex:1 1 260px;max-width:420px;display:flex;flex-direction:column;gap:16px}
.ph-head{padding:22px 16px 16px;background:var(--surface-000);border-bottom:1px solid var(--hairline);display:flex;flex-direction:column;gap:12px}
.ph-head .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ph-head .logo{height:18px;width:auto}
.ph-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.ph-foot{padding:12px 16px 18px;border-top:1px solid var(--hairline);background:var(--surface-000);display:flex;flex-direction:column;gap:8px}
.ph-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--hairline);background:var(--surface-000)}
.ph-tabs button{min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;color:var(--ink-muted);background:none;border:0;cursor:pointer}
.ph-tabs button.on{color:var(--gold)}
.iconbtn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--ink);background:none;border:0;cursor:pointer;flex:none}
.check{padding:14px;display:flex;align-items:center;gap:12px;text-align:left;cursor:pointer;min-height:56px;width:100%}
.check .box{width:22px;height:22px;flex:none;border:1px solid var(--hairline-strong);display:flex;align-items:center;justify-content:center;color:var(--on-gold);font-size:14px}
.check.on{border-color:var(--gold-line)}
.check.on .box{background:var(--gold);border-color:var(--gold)}
.avatar{border-radius:999px;background:var(--gold-tint);border:1px solid var(--gold-line);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);color:var(--gold);flex:none}
@media (max-width:860px){
  .phone{border-radius:20px;height:auto;max-height:none;min-height:0;width:100%}
  .phone .ph-body{overflow:visible}
}

.banner{padding:16px 20px;border-color:var(--green);display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.empty{padding:28px 20px;text-align:center;color:var(--ink-muted);border:1px dashed var(--hairline-strong);border-radius:12px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--surface-raised);color:var(--ink);border:1px solid var(--gold-line);padding:12px 18px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.4);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:50;max-width:calc(100% - 32px);font-size:13px}
.toast.show{opacity:1;transform:translate(-50%,0)}
.demo-tag{display:inline-flex;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-muted);border:1px dashed var(--hairline-strong);padding:2px 8px;border-radius:999px;align-self:flex-start}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="shell">
  <aside class="side" id="side"></aside>
  <main class="main" id="main"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = off => { const d = new Date(TODAY); d.setDate(d.getDate() + off); return d.getDate() + ' ' + d.toLocaleString('en-GB', { month: 'short' }) };
const initials = n => n.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('');
const SLA = 9;
const reqById = id => S.requests.find(r => r.id === id);
const candsOf = id => S.cands.filter(c => c.req === id);
const deployed = r => r.prefilled + candsOf(r.id).filter(c => c.stage === 5).length;
function status(r) {
  if (r.status === 'approval') return { label: 'Approval', pill: 'pill-gold', k: 'approval' };
  if (r.status === 'closed' || deployed(r) >= r.count) return { label: 'Completed', pill: 'pill-ok', k: 'done' };
  if (r.day > SLA) return { label: 'Overdue', pill: 'pill-bad', k: 'late' };
  if (r.day >= SLA - 1) return { label: 'At risk', pill: 'pill-warn', k: 'risk' };
  return { label: 'On track', pill: 'pill-ok', k: 'ok' };
}

  reset() { S = seed(); Object.assign(UI, { reqForm: null, submitted: null, candForm: null, candSent: null, nudged: {}, errors: {}, trackReq: 'MR-1042', worker: 'CW-2607' }); save(); toast('Sample data restored'); render() },
  dashTab(v) { UI.dashTab = v; render() },
  approve(v) { const r = reqById(v); r.status = 'open'; r.day = 1; save(); toast(`${v} approved. ${r.contractor} can now see it in the contractor app.`); render() },
  openTracker(v) { UI.trackReq = v; go('tracker') },
  openWorker(v) { UI.worker = v; go('workers') },
  reqReason(v) { UI.reqForm.reason = v; render() },
  reqContractor(v) { UI.reqForm.contractor = v; render() },
  reqDraft() { toast('Draft saved on this device') },
  nudge(v) { UI.nudged[v] = true; toast(`Reminder queued for ${reqById(v).contractor} (WhatsApp in the live app)`); render() },
  advance(v) {
    const c = S.cands.find(x => x.id === v);
    const pend = Object.values(c.docs).filter(x => x === 'pending' || x === 'bad').length;
    if (c.stage === 2 && pend) { toast(`Verify ${c.name}'s ${pend} pending document${pend > 1 ? 's' : ''} first`); UI.worker = v; return go('workers') }
    c.stage++; c.days = 0;
    if (c.stage === 2) c.docs.trade = 'ok';
    if (c.stage === 3 && c.docs.medical === 'wait') c.docs.medical = 'pending';
    log(c, 'Moved to ' + STAGES[c.stage]); UI.fresh = c.id; save(); render();
  },
  doc(v) {
    const [k, st] = v.split(':'), c = S.cands.find(x => x.id === UI.worker);
    c.docs[k] = st; const name = DOCS.find(d => d[0] === k)[1];
    log(c, st === 'ok' ? name + ' verified by HR' : st === 'bad' ? name + ' rejected · re-upload asked' : name + ' re-uploaded');
    save(); render();
  },
  copyReport() {
    const P = PERIODS[UI.period];
    const text = `Aristo contract manpower · impact (${P.name})\n` + P.goals.map(g => `${g[0]}: ${g[1]} (${g[2]})`).join('\n');
    const done = () => toast('Summary copied');
    try { navigator.clipboard.writeText(text).then(done, () => toast('Copy is blocked here. Select the figures on the page instead.')) } catch (e) { toast('Copy is blocked here. Select the figures on the page instead.') }
  },
  cTab(v) { UI.contractorTab = v; sub = null; render() },
  addCand(v) { if (!v) return toast('No open requests to add candidates to'); if (UI.candReq !== v) { UI.candSent = null } UI.candReq = v; UI.errors = {}; sub = 'add'; render() },
  cBack() { sub = null; UI.candSent = null; render() },
  alerts() { const late = S.requests.filter(r => r.contractor === ME && status(r).k === 'late'); toast(late.length ? `${late.length} overdue: ${late.map(r => r.id).join(', ')}` : 'No alerts') },
  candSubmit() {
    const f = UI.candForm, e = {};
    if (!f.name.trim()) e.name = 'Enter the candidate’s full name';
    if (f.mobile.replace(/\D/g, '').length < 10) e.mobile = 'Enter a 10-digit mobile number';
    const miss = UPLOADS.filter(([k, , req]) => req && !f.up[k]).map(u => u[1]);
    if (miss.length) e.docs = 'Scan ' + miss.join(', ') + ' to submit';
    UI.errors = e;
    if (Object.keys(e).length) return render();
    const docs = docsForStage(0);
    if (!f.up.pf) docs.pf = 'wait';
    const id = 'CW-' + (2604 + S.cands.length + 100);
    S.cands.push({ id, name: f.name.trim(), req: UI.candReq, stage: 0, days: 0, docs, ind: {}, log: [{ when: 0, what: `Candidate submitted by ${ME} for ${UI.candReq}` }] });
    UI.candSent = f.name.trim(); UI.candForm = { ...blankCand(), name: '', mobile: '', dob: '', up: {} }; UI.fresh = id; UI.trackReq = UI.candReq;
    save(); toast(`${UI.candSent} submitted to ${UI.candReq}`); render();
    document.querySelector('.ph-body')?.scrollTo(0, 0);
  },
  who(v) { UI.superWho = v; render() },
  check(v) { const c = S.cands.find(x => x.id === UI.superWho); c.ind[v] = !c.ind[v]; if (v === 'safety') c.docs.safety = c.ind[v] ? 'ok' : 'wait'; save(); render() },
  join() {
    const c = S.cands.find(x => x.id === UI.superWho);
    c.stage = 5; c.days = 0; c.joinedToday = true; c.docs.safety = 'ok'; c.docs.letter = 'ok';
    log(c, 'Joining confirmed by supervisor · letter e-signed'); save(); toast(`${c.name} joined. Dashboard and tracker updated.`); render();
  }
};
document.addEventListener('click', ev => {
  const a = ev.target.closest('[data-act]');
  if (a && !a.disabled) { ev.preventDefault(); return ACT[a.dataset.act]?.(a.dataset.v) }
  const g = ev.target.closest('[data-go]');
  if (g) { ev.preventDefault(); go(g.dataset.go) }
});
document.addEventListener('input', ev => {
  const p = ev.target.dataset.field; if (!p) return;
  const [obj, key] = p.split('.'); UI[obj][key] = ev.target.value;
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset.field) { const [obj, key] = t.dataset.field.split('.'); UI[obj][key] = t.value; if ('rerender' in t.dataset) render(); return }
  if (t.dataset.change) { UI[t.dataset.change] = t.value; return render() }
  if (t.dataset.upload && t.files && t.files[0]) { UI.candForm.up[t.dataset.upload] = t.files[0].name; if (UI.errors.docs) UI.errors.docs = null; render() }
});
document.addEventListener('submit', ev => {
  ev.preventDefault();
  if (ev.target.id === 'candForm') return ACT.candSubmit();
  if (ev.target.id !== 'reqForm') return;
  const f = UI.reqForm, e = {}, n = parseInt(f.count, 10);
  if (!String(f.role).trim()) e.role = 'Enter the role or skill needed';
  if (!(n >= 1 && n <= 200)) e.count = 'Enter a headcount between 1 and 200';
  UI.errors = e;
  if (Object.keys(e).length) return render();
  const id = 'MR-' + S.nextMr++;
  S.requests.unshift({ id, role: f.role.trim(), count: n, plant: f.plant, dept: f.dept, shift: f.shift, skill: f.skill, note: f.note.length < 40 ? f.note : '', contractor: f.contractor, day: 0, status: 'approval', prefilled: 0 });
  UI.submitted = id; UI.reqForm = null; save(); toast(id + ' sent for approval'); render(); window.scrollTo(0, 0);
});

route = ROUTES[location.hash.slice(1)] ? location.hash.slice(1) : 'dashboard';
render();
</script>
